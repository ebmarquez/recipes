name: Private cookbook checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: cookbook-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up tested Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.7.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Validate recipe contract and content
        run: npm run test:content
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Check site documentation
        run: npx --no-install markdownlint README.md docs/authoring.md
      - name: Build static site and Pagefind index
        run: npm run build
      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify private build in Chromium
        run: npm run test:e2e
